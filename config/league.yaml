# Default league shape (12-team ESPN standard). Verified against ESPN when connected.
teams: 12
lineup:
  QB: 1
  RB: 2
  WR: 2
  TE: 1
  FLEX: 1       # RB/WR/TE
  bench: 7
# Weekly "starter" threshold = teams x starters at that position (QB 12, RB 24, WR 24, TE 12).
# The FLEX slot is NOT folded into RB/WR here; it is expressed separately as flex_worthy_rank
# (tests/test_config.py asserts both relationships).
starter_rank_threshold:
  QB: 12
  RB: 24
  WR: 24
  TE: 12
flex_worthy_rank: 36    # teams x (RB + FLEX) = 36: a RB/WR ranked top-36 is worth a FLEX start
# "Likely available on waivers" = outside the top (starters x 1.5) by ADP (average draft
# position, i.e. where real drafts took the player) and PPG (fantasy points per game).
candidate_pool_multiplier: 1.5
