[project]
name = "twm"
version = "0.1.0"
description = "Two-Minute Warning: a point-in-time NFL early-warning app with a public track record."
readme = "README.md"
license = "MIT"
authors = [{ name = "Batuhan Isik" }]
requires-python = ">=3.13"
dependencies = [
    "nflreadpy>=0.1.0",
    "polars>=1.0",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pydantic>=2.8",
    "pyyaml>=6",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "statsmodels>=0.14",
    "httpx>=0.27",
    "tenacity>=9",
    "psycopg[binary]>=3.3",
]

[project.optional-dependencies]
espn = ["espn-api>=0.40"]

[project.scripts]
twm = "twm.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "jupyter>=1.1",
    "matplotlib>=3.9",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]  # typer.Option/Argument defaults are the idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
# Offline by default: a plain `uv run pytest` never downloads. `uv run pytest -m network` runs
# the live drift check (a later -m on the command line overrides this one).
addopts = "-q -m 'not network and not realdata and not postgres'"
markers = [
    "network: tests that download nflverse data (skipped in CI)",
    "realdata: tests that read the real data/raw cache (never download; skipped when it is absent)",
    "postgres: tests that need the local Postgres (`docker compose up -d twm-postgres`; skipped when it is not reachable)",
]
